# The general-purpose resume (what pdf/resume-*.pdf shows).
# Copy this file to tailored/<job>/selection.yaml and edit it to tailor a resume.
#
# Every entry refers to a bank file by its name without .md, and to bullets by
# their `## id`. Leave out `bullets` (or `items` for skills) to take all of them
# in file order. Order in this file = order on the page. `bullets: []` shows the
# entry's heading only (a degree line).

sections: [education, experience, projects, skills]

education:
  - id: ut3-master-iafa
    bullets: [tir-paper]
  - id: corse-licence
    bullets: []
  - id: oujda-licence
    bullets: []

experience:
  - id: magellan
    bullets:
      - bugpredict-pitch
      - bugpredict-time
      - bugpredict-vs-testers
      - bugpredict-mcp
      - argus-pitch
  - id: isis-champollion
    bullets: [easytalk-pitch, easytalk-models, easyrmm-results-short]
  - id: cnrs-lisa
    bullets: [lisa-pitch, lisa-results]

projects:
  - id: ninurta
    bullets: [resume-tailoring, claude-code]
  - id: gmath
    bullets: [ml-from-scratch]

skills:
  - id: languages
    items: [Python, C++, Java, TypeScript/JavaScript, SQL]
  - id: ai-ml
    items:
      - LangGraph
      - PyTorch
      - Hugging Face Transformers
      - agentic systems and evaluation
      - NLP (CamemBERT, GLiNER, Flair, HeidelTime, Mistral)
      - computer vision
  - id: tools
    items:
      - FastAPI
      - Docker
      - Google Cloud (Vertex AI, GKE, Cloud Storage)
      - GitLab CI/CD
      - Git
      - React
      - OpenGL
  - id: spoken
