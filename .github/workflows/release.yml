name: Release

# Push a tag on main to publish a version:  git tag v1.0.0 && git push origin v1.0.0
# Builds the main resume in both languages and attaches the PDFs to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Install poppler and Source Sans 3 (the resume font; Ubuntu has no package for it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils unzip
          curl -fsSL -o /tmp/source-sans.zip \
            https://github.com/adobe-fonts/source-sans/releases/download/3.052R/OTF-source-sans-3.052R.zip
          sudo mkdir -p /usr/local/share/fonts/source-sans
          sudo unzip -q -o -j /tmp/source-sans.zip '*.otf' -d /usr/local/share/fonts/source-sans
          fc-cache -f
          fc-list | grep -q "Source Sans 3" || { echo "Source Sans 3 not installed"; exit 1; }
      - name: Build both languages
        run: python -m brain main
      - name: One page each
        run: |
          for l in en fr; do
            test "$(pdfinfo pdf/resume-$l.pdf | awk '/^Pages/{print $2}')" -eq 1
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pdf/resume-en.pdf "resume-${GITHUB_REF_NAME}-en.pdf"
          cp pdf/resume-fr.pdf "resume-${GITHUB_REF_NAME}-fr.pdf"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "Ninurta $GITHUB_REF_NAME" \
            "resume-${GITHUB_REF_NAME}-en.pdf" "resume-${GITHUB_REF_NAME}-fr.pdf"
