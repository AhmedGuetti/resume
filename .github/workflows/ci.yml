name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  resume:
    # Builds the general resume from the bank and fails if it no longer fits one page,
    # or if the committed cv/resume-*.tex are out of date with bank/.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Install TeX Live, fonts and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-extra texlive-lang-french latexmk chktex \
            poppler-utils unzip
      - name: Install Source Sans 3 (the resume font; Ubuntu has no package for it)
        run: |
          curl -fsSL -o /tmp/source-sans.zip \
            https://github.com/adobe-fonts/source-sans/releases/download/3.052R/OTF-source-sans-3.052R.zip
          sudo mkdir -p /usr/local/share/fonts/source-sans
          sudo unzip -q -o -j /tmp/source-sans.zip '*.otf' -d /usr/local/share/fonts/source-sans
          fc-cache -f
          fc-list | grep -q "Source Sans 3" || { echo "Source Sans 3 not installed"; exit 1; }
      - name: Build both languages
        run: make -B all
      - name: Generated .tex match the bank
        run: git diff --exit-code -- cv/resume-en.tex cv/resume-fr.tex
      - name: One page each
        run: |
          make check
          for l in en fr; do
            p=$(pdfinfo pdf/resume-$l.pdf | awk '/^Pages/{print $2}')
            echo "resume-$l: $p page(s)"
            test "$p" -eq 1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: pdf/*.pdf
