name: CI

# GitHub Flow: feature branches -> PR into dev -> PR from dev into main (prod).
# Pull requests run everything; pushes run it again on the two long-lived branches.
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Install poppler and Source Sans 3 (the resume font; Ubuntu has no package for it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils unzip
          curl -fsSL -o /tmp/source-sans.zip \
            https://github.com/adobe-fonts/source-sans/releases/download/3.052R/OTF-source-sans-3.052R.zip
          sudo mkdir -p /usr/local/share/fonts/source-sans
          sudo unzip -q -o -j /tmp/source-sans.zip '*.otf' -d /usr/local/share/fonts/source-sans
          fc-cache -f
          fc-list | grep -q "Source Sans 3" || { echo "Source Sans 3 not installed"; exit 1; }
      - run: python -m pytest

  resume:
    # Builds the general resume from the bank (Typst, via python -m brain main) and
    # fails if it no longer fits one page.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Install poppler and Source Sans 3 (the resume font; Ubuntu has no package for it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils unzip
          curl -fsSL -o /tmp/source-sans.zip \
            https://github.com/adobe-fonts/source-sans/releases/download/3.052R/OTF-source-sans-3.052R.zip
          sudo mkdir -p /usr/local/share/fonts/source-sans
          sudo unzip -q -o -j /tmp/source-sans.zip '*.otf' -d /usr/local/share/fonts/source-sans
          fc-cache -f
          fc-list | grep -q "Source Sans 3" || { echo "Source Sans 3 not installed"; exit 1; }
      - name: Build both languages
        run: python -m brain main --text
      - name: One page each
        run: |
          for l in en fr; do
            p=$(pdfinfo pdf/resume-$l.pdf | awk '/^Pages/{print $2}')
            echo "resume-$l: $p page(s)"
            test "$p" -eq 1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: pdf/*.pdf

  web:
    # The Svelte page of `python -m brain serve` must build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
